name: SKsAppMenu
options:
  bundleIdPrefix: com.siveesh
  deploymentTarget:
    macOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '27.0'
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 6
    DEVELOPMENT_TEAM: ''
targets:
  MenuCore:
    type: library.static
    platform: macOS
    sources: [Sources/Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siveesh.sksappmenu.core
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SKsAppMenu:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Resources
        excludes: [Info.plist, Branding]
    dependencies:
      - target: MenuCore
    settings:
      base:
        PRODUCT_NAME: SK's App Menu
        EXECUTABLE_NAME: SKsAppMenu
        PRODUCT_MODULE_NAME: SKsAppMenu
        PRODUCT_BUNDLE_IDENTIFIER: com.siveesh.sksappmenu
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
  SKsAppMenuTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/AppTests]
    dependencies:
      - target: SKsAppMenu
      - target: MenuCore
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siveesh.sksappmenu.apptests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SK's App Menu.app/Contents/MacOS/SKsAppMenu"
        BUNDLE_LOADER: "$(TEST_HOST)"
  MenuCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/CoreTests]
    dependencies:
      - target: MenuCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siveesh.sksappmenu.coretests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SKsAppMenu:
    build:
      targets:
        SKsAppMenu: all
        MenuCoreTests: [test]
        SKsAppMenuTests: [test]
    test:
      environmentVariables:
        SK_APP_MENU_STORE_DIRECTORY: $(PROJECT_DIR)/Temporary/XcodeTestStore
      targets: [MenuCoreTests, SKsAppMenuTests]
